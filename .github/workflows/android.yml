name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - "docs/format/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      # Empty for forks; the app then asks the user for their own client.
      ZAPASSKA_GOOGLE_CLIENT_ID: ${{ secrets.ANDROID_GOOGLE_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Checks this client against the same vectors the desktop suite uses.
      - name: Run unit tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest

      # Google matches the OAuth client against this certificate, so the
      # signed build is the only one whose fingerprint stays put.
      - name: Unpack the signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          # base64 wrapped at 76 columns is normal on macOS; drop any whitespace
          # so the decode does not depend on how the secret was produced.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' \
            | base64 -d > "$RUNNER_TEMP/zapasska.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/zapasska.jks" >> "$GITHUB_ENV"

          # Gradle reports every signing failure as "keystore password was
          # incorrect", whichever of the three it was. These two lines rule out
          # a damaged transfer without touching the passwords at all.
          echo "Decoded keystore: $(wc -c < "$RUNNER_TEMP/zapasska.jks") bytes"
          echo "sha256: $(sha256sum "$RUNNER_TEMP/zapasska.jks" | cut -d" " -f1)"

      # Gradle reports a bad password only after a two-minute build, and does
      # not say which of the two is wrong. keytool answers in a second.
      - name: Check the keystore opens
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          store=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
          alias=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '[:space:]')
          key=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')

          if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" \
                       -storepass "$store" >/dev/null 2>&1; then
            echo "::error::The keystore did not open. keytool said:"
            keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$store" 2>&1 \
              | grep -i 'keytool error' || true
            echo "::error::'password was incorrect' means" \
                 "ANDROID_KEYSTORE_PASSWORD is wrong. 'Integrity check failed'" \
                 "means the file arrived damaged: compare the sha256 above with" \
                 "'sha256sum zapasska.jks' on your machine."
            exit 1
          fi

          if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -alias "$alias" \
                       -storepass "$store" >/dev/null 2>&1; then
            echo "::error::The keystore opens, but it holds no alias" \
                 "'$alias'. Aliases present:"
            keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$store" \
              | grep -i 'PrivateKeyEntry' || true
            exit 1
          fi

          if ! keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -alias "$alias" \
                       -storepass "$store" -keypass "$key" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_PASSWORD is wrong for alias '$alias'." \
                 "It is often the same as the keystore password."
            exit 1
          fi

          echo "The keystore opens and holds the alias. Signing can proceed."
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$alias" \
                  -storepass "$store" | grep -E 'SHA1:|SHA256:'

      - name: Build APK
        working-directory: android
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            gradle --no-daemon :app:assembleRelease
          else
            echo "No signing keystore configured, building a debug APK."
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Report the certificate the APK was signed with
        run: |
          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $apk"
          keytool -printcert -jarfile "$apk" | grep -E 'SHA1:|Owner:' || true

      - uses: actions/upload-artifact@v4
        with:
          name: ZaPassKa-android
          path: android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: Publish test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
