name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - "docs/format/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      # Empty for forks; the app then asks the user for their own client.
      ZAPASSKA_GOOGLE_CLIENT_ID: ${{ secrets.ANDROID_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Checks this client against the same vectors the desktop suite uses.
      - name: Run unit tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ZaPassKa-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
