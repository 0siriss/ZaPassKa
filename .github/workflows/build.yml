name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows executable
            artifact: ZaPassKa-windows-x64
            binary: dist/ZaPassKa.exe
          - os: ubuntu-latest
            label: Linux executable
            artifact: ZaPassKa-linux-x64
            binary: dist/ZaPassKa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Builds from a repository that holds the secrets ship with a Google
      # OAuth client. Everyone else builds without one, and the app then asks
      # the user for their own client the first time they connect Drive.
      - name: Bake in the Google OAuth client
        if: env.GOOGLE_CLIENT_ID != ''
        shell: python
        run: |
          import os, pathlib
          pathlib.Path("build_config.py").write_text(
              'GOOGLE_CLIENT_ID = {!r}\n'
              'GOOGLE_CLIENT_SECRET = {!r}\n'.format(
                  os.environ["GOOGLE_CLIENT_ID"],
                  os.environ["GOOGLE_CLIENT_SECRET"]),
              encoding="utf-8")

      - name: Build executable
        run: pyinstaller --noconfirm --clean main.spec

      - name: Check the binary exists
        shell: bash
        run: test -f "${{ matrix.binary }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lay out the release files
        run: |
          mkdir -p release
          cp artifacts/ZaPassKa-windows-x64/ZaPassKa.exe release/ZaPassKa-windows-x64.exe
          cp artifacts/ZaPassKa-linux-x64/ZaPassKa release/ZaPassKa-linux-x64
          chmod +x release/ZaPassKa-linux-x64

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
